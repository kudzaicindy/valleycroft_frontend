      <stop stop-color="#3d6b1e"/>
      <stop offset="1" stop-color="#1e3610"/>
    </linearGradient>
    <linearGradient id="vc-leaf" x1="20" y1="14" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#EDE8DC"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#vc-bg)"/>
  <!-- Soft gold sun -->
  <circle cx="46" cy="18" r="7" fill="#B8892A" opacity="0.95"/>
  <circle cx="46" cy="18" r="4.2" fill="#d4a84b" opacity="0.85"/>
  <!-- Leaf -->
  <path
